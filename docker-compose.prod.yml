# Standalone server config: uses a tested registry image, never builds source.
services:
  frontend:
    image: ${MOVIERATER_IMAGE:?Angiv et versionsfastlåst GHCR-image i .env.server}
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:8080"
    restart: unless-stopped
    # The published image already defines the frontend healthcheck.
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop: [ALL]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 256m
    cpus: 0.50
