services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    environment:
      VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:?Angiv VITE_SUPABASE_URL i .env}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY:?Angiv VITE_SUPABASE_PUBLISHABLE_KEY i .env}
      VITE_TMDB_API_KEY: ${VITE_TMDB_API_KEY}
      VITE_TMDB_BASE_URL: ${VITE_TMDB_BASE_URL}
      VITE_TMDB_IMAGE_BASE: ${VITE_TMDB_IMAGE_BASE}
      VITE_OMDB_API_KEY: ${VITE_OMDB_API_KEY}
      VITE_OMDB_BASE_URL: ${VITE_OMDB_BASE_URL}
      DOCKER_WATCH_POLLING: "true"
    volumes:
      - ./src:/app/src:ro
      - ./index.html:/app/index.html:ro
      - ./vite.config.ts:/app/vite.config.ts:ro
      - ./tsconfig.json:/app/tsconfig.json:ro
      - ./postcss.config.mjs:/app/postcss.config.mjs:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
