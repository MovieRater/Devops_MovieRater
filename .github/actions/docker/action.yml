name: Build and test Docker
description: Build once, check HTTP endpoints and scan the image and dependency lockfile.
inputs:
  reuse:
    description: Use the existing commit image instead of rebuilding
    default: "false"
  cache-scope:
    description: Build cache name
    default: pr
runs:
  using: composite
  steps:
    - name: Set up Docker Buildx
      if: inputs.reuse != 'true'
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

    # Dockerfile runs npm run build; CI does not need a second frontend build.
    - name: Build frontend and Docker image
      if: inputs.reuse != 'true'
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
      with:
        context: .
        platforms: linux/amd64
        load: true
        tags: movierater-ci:${{ github.sha }}
        labels: |
          org.opencontainers.image.source=https://github.com/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}
        build-args: |
          VITE_SUPABASE_URL=${{ env.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY=${{ env.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_TMDB_API_KEY=${{ env.VITE_TMDB_API_KEY }}
          VITE_TMDB_BASE_URL=${{ env.VITE_TMDB_BASE_URL }}
          VITE_TMDB_IMAGE_BASE=${{ env.VITE_TMDB_IMAGE_BASE }}
          VITE_OMDB_API_KEY=${{ env.VITE_OMDB_API_KEY }}
          VITE_OMDB_BASE_URL=${{ env.VITE_OMDB_BASE_URL }}
        cache-from: type=gha,scope=movierater-${{ inputs.cache-scope }}
        cache-to: type=gha,mode=max,scope=movierater-${{ inputs.cache-scope }}

    - name: Test container and HTTP endpoints
      shell: bash
      run: node scripts/docker-smoke.mjs "movierater-ci:$GITHUB_SHA"

    - name: Scan image and dependencies
      uses: ./.github/actions/scan
      with:
        image: movierater-ci:${{ github.sha }}

    - name: Upload security reports
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: trivy-${{ github.run_id }}-${{ github.run_attempt }}
        path: trivy-*.json
        if-no-files-found: warn
        retention-days: ${{ inputs.cache-scope == 'publish' && 30 || 14 }}

    - name: Clean up test container
      if: always()
      shell: bash
      run: docker rm --force "$DOCKER_SMOKE_CONTAINER" 2>/dev/null || true
