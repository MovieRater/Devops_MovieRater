name: CI / CD

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested image (main or version tags only)
        type: boolean
        default: true

permissions:
  contents: read

# Tests and PR builds use public placeholders, never the production database.
env:
  DOCKER_SMOKE_CONTAINER: movierater-ci-${{ github.run_id }}-${{ github.run_attempt }}
  VITE_SUPABASE_URL: https://example.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
  VITE_TMDB_API_KEY: ci_placeholder_tmdb_key
  VITE_TMDB_BASE_URL: https://api.themoviedb.org/3
  VITE_TMDB_IMAGE_BASE: https://image.tmdb.org/t/p/original
  VITE_OMDB_API_KEY: ci_placeholder_omdb_key
  VITE_OMDB_BASE_URL: https://www.omdbapi.com/

jobs:
  # Continuous integration: validate changes before building or publishing.
  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: test-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Use Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint and typecheck
        run: |
          npm run lint
          npm run typecheck

      - name: Run tests with coverage
        run: npm run test:ci

      - name: Run deployment tests
        run: npm run test:integration

      - name: Run browser tests
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage/
          if-no-files-found: warn
          retention-days: ${{ (github.event_name == 'push' || inputs.publish) && 30 || 14 }}

      - name: Upload browser failure reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 7

      - name: Summarize CI result
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          echo "## CI tests: $RESULT" >> "$GITHUB_STEP_SUMMARY"
          echo 'See job steps for timings and Artifacts for coverage and browser failure reports.' >> "$GITHUB_STEP_SUMMARY"

  # PR build: the Dockerfile builds the frontend, then HTTP and security are checked.
  docker:
    name: Build and test Docker
    needs: test
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && !inputs.publish)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: docker-pr-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Use Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc

      - name: Build, test and scan Docker image
        uses: ./.github/actions/docker

  # Continuous delivery: publish the tested image to GHCR, ready for deployment.
  publish:
    # This name also verifies existing release records during rollback.
    name: Test, scan and publish image
    needs: test
    if: github.repository == 'MovieRater/Devops_MovieRater' && (github.event_name == 'push' || inputs.publish) && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    concurrency:
      group: movierater-publish
      queue: max
      cancel-in-progress: false
    outputs:
      image_ref: ${{ steps.release.outputs.image_ref }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Use Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare release and reuse an existing commit image
        id: image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_TMDB_API_KEY: ${{ secrets.VITE_TMDB_API_KEY || vars.VITE_TMDB_API_KEY }}
          VITE_TMDB_BASE_URL: ${{ secrets.VITE_TMDB_BASE_URL || vars.VITE_TMDB_BASE_URL }}
          VITE_TMDB_IMAGE_BASE: ${{ secrets.VITE_TMDB_IMAGE_BASE || vars.VITE_TMDB_IMAGE_BASE }}
          VITE_OMDB_API_KEY: ${{ secrets.VITE_OMDB_API_KEY || vars.VITE_OMDB_API_KEY }}
          VITE_OMDB_BASE_URL: ${{ secrets.VITE_OMDB_BASE_URL || vars.VITE_OMDB_BASE_URL }}
        run: node scripts/publish-image.mjs prepare

      - name: Build, test and scan Docker image
        uses: ./.github/actions/docker
        with:
          reuse: ${{ steps.image.outputs.reuse }}
          cache-scope: publish

      - name: Publish the tested image without rebuilding
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REUSED: ${{ steps.image.outputs.reuse }}
        run: node scripts/publish-image.mjs publish

      - name: Verify published digest and record release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release.mjs record

      - name: Test the image pulled from GHCR
        env:
          APPROVED_IMAGE: ${{ steps.release.outputs.image_ref }}
        run: node scripts/docker-smoke.mjs "$APPROVED_IMAGE"

      - name: Upload approved release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: movierater-release-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            release.json
            docker-compose.prod.yml
            docker-compose.https.yml
            Caddyfile
            scripts/deploy.sh
          if-no-files-found: error
          retention-days: 90

  # Continuous deployment: deploy a verified main release when enabled.
  deploy:
    name: Deploy
    needs: publish
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true' && needs.publish.outputs.image_ref != ''
    permissions:
      contents: read
      packages: read
      actions: read
    uses: ./.github/workflows/deploy.yml
    with:
      image_ref: ${{ needs.publish.outputs.image_ref }}
      revision: ${{ github.sha }}
      publish_run_id: ${{ github.run_id }}
      automatic: true
