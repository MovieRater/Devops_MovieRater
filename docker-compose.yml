services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:?Angiv VITE_SUPABASE_URL i .env}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY:?Angiv VITE_SUPABASE_PUBLISHABLE_KEY i .env}
        VITE_TMDB_API_KEY: ${VITE_TMDB_API_KEY:?Angiv VITE_TMDB_API_KEY i .env}
        VITE_TMDB_BASE_URL: ${VITE_TMDB_BASE_URL:?Angiv VITE_TMDB_BASE_URL i .env}
        VITE_TMDB_IMAGE_BASE: ${VITE_TMDB_IMAGE_BASE:?Angiv VITE_TMDB_IMAGE_BASE i .env}
        VITE_OMDB_API_KEY: ${VITE_OMDB_API_KEY:?Angiv VITE_OMDB_API_KEY i .env}
        VITE_OMDB_BASE_URL: ${VITE_OMDB_BASE_URL:?Angiv VITE_OMDB_BASE_URL i .env}
    ports:
      - "${HTTP_PORT:-8080}:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 256m
    cpus: 0.50
